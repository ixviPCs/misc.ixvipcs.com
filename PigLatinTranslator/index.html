<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pig Latin Translator</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #ffe4e1;
      text-align: center;
      padding: 40px;
    }
    textarea, input {
      width: 80%;
      max-width: 500px;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #ff69b4;
      font-size: 1.1rem;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    button:hover {
      background: #ff1493;
    }
    #output {
  margin: 24px auto 16px auto; /* top/bottom spacing and auto center */
  font-size: 1.3rem;
  color: #8b008b;
  white-space: pre-wrap; /* preserves line breaks and spacing */
  text-align: center; /* center the text */
  max-width: 500px;
}

    #copyBtn {
      display: block; /* makes it appear below output */
      margin: 20px auto 0 auto; /* spacing from output */
    }
  </style>
</head>
<body>
  <h1>🐷 Pig Latin Translator 🐷</h1>
  <textarea id="inputText" rows="6" placeholder="Type your sentence here..."></textarea><br />
  <button onclick="translateSentence()">Translate</button>

  <div id="output"></div>
  <button id="copyBtn" onclick="copyOutput()" style="display:none;">Copy</button>

  <script>
    function customPigLatin(word) {
      const vowels = ['a','e','i','o','u'];
      if(word.length === 0) return word;

      const match = word.match(/^(\W*)(\w+)(\W*)$/);
      if(!match) return word;
      const startPunct = match[1] || '';
      const coreWord = match[2] || '';
      const endPunct = match[3] || '';

      const isCapitalized = coreWord[0] === coreWord[0].toUpperCase();

      const firstChar = coreWord[0].toLowerCase();
      const lastChar = coreWord[coreWord.length-1].toLowerCase();
      let translated = '';

      if(vowels.includes(firstChar)) {
        if(lastChar === 'y') translated = coreWord + 'ay';
        else translated = coreWord + 'yay';
      } else {
        let moved = coreWord.slice(1) + coreWord[0];
        const newLastChar = moved[moved.length-1].toLowerCase();
        if(vowels.includes(newLastChar) && newLastChar !== 'y') translated = moved + 'yay';
        else translated = moved + 'ay';
      }

      if(isCapitalized) translated = translated[0].toUpperCase() + translated.slice(1).toLowerCase();

      return startPunct + translated + endPunct;
    }

    function translateSentence() {
      const input = document.getElementById('inputText').value;

      if(input.trim() === '') {
        document.getElementById('output').innerText = '';
        document.getElementById('copyBtn').style.display = 'none';
        return;
      }

      const lines = input.split(/\n/);
      const translatedLines = lines.map(line => {
        const words = line.split(/(\s+)/);
        return words.map(word => word.trim() === '' ? word : customPigLatin(word)).join('');
      });

      const output = translatedLines.join('\n');
      document.getElementById('output').innerText = output;
      document.getElementById('copyBtn').style.display = 'inline-block';
    }

    function copyOutput() {
      const copyBtn = document.getElementById('copyBtn');
      const outputText = document.getElementById('output').innerText;

      navigator.clipboard.writeText(outputText).then(() => {
        copyBtn.innerText = 'Copied! ✅';
        setTimeout(() => {
          copyBtn.innerText = 'Copy';
          document.getElementById('inputText').focus();
        }, 2000);
      }).catch(() => {
        copyBtn.innerText = 'Copy';
        alert('Oops, copy failed 😬');
      });
    }

    document.getElementById('inputText').addEventListener('input', () => {
      if(document.getElementById('inputText').value.trim() === '') {
        document.getElementById('output').innerText = '';
        document.getElementById('copyBtn').style.display = 'none';
      }
    });
  </script>
</body>
</html>
