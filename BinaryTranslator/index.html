<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💻 Hacker Binary Translator 💻</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #0f0f0f;
      color: #00ff00;
      text-align: center;
      padding: 40px;
    }
    textarea, input {
      width: 80%;
      max-width: 500px;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #00ff00;
      background: #111;
      color: #00ff00;
      font-size: 1rem;
    }
    button {
      background: #00ff00;
      color: #0f0f0f;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    button:hover {
      background: #39ff14;
    }
    #output {
  margin: 24px auto 16px auto;
  font-size: 1.2rem;
  color: #00ff00;
  white-space: pre-wrap;
  text-align: center;
  max-width: 500px;
  /* remove these lines: */
  /* border: 1px solid #00ff00; */
  /* padding: 12px; */
  /* border-radius: 8px; */
  /* background: #111; */
}
    #copyBtn {
      display: block;
      margin: 20px auto 0 auto;
    }
  </style>
</head>
<body>
  <h1>💻 Hacker Binary Translator 💻</h1>
  <textarea id="inputText" rows="6" placeholder="Type your text here..."></textarea><br />
  <button onclick="translateToBinary()">Translate</button>

  <div id="output"></div>
  <button id="copyBtn" onclick="copyOutput()" style="display:none;">Copy</button>

  <script>
    function toBinary(str) {
      return str.split('').map(char => {
        return char.charCodeAt(0).toString(2).padStart(8, '0');
      }).join(' ');
    }

    function translateToBinary() {
      const input = document.getElementById('inputText').value;

      if(input.trim() === '') {
        document.getElementById('output').innerText = '';
        document.getElementById('copyBtn').style.display = 'none';
        return;
      }

      const lines = input.split(/\n/);
      const binaryLines = lines.map(line => toBinary(line));
      const output = binaryLines.join('\n');

      document.getElementById('output').innerText = output;
      document.getElementById('copyBtn').style.display = 'inline-block';
    }

    function copyOutput() {
      const copyBtn = document.getElementById('copyBtn');
      const outputText = document.getElementById('output').innerText;

      navigator.clipboard.writeText(outputText).then(() => {
        copyBtn.innerText = 'Copied! ✅';
        setTimeout(() => {
          copyBtn.innerText = 'Copy';
          document.getElementById('inputText').focus();
        }, 2000);
      }).catch(() => {
        copyBtn.innerText = 'Copy';
        alert('Oops, copy failed 😬');
      });
    }

    document.getElementById('inputText').addEventListener('input', () => {
      if(document.getElementById('inputText').value.trim() === '') {
        document.getElementById('output').innerText = '';
        document.getElementById('copyBtn').style.display = 'none';
      }
    });
  </script>
</body>
</html>
